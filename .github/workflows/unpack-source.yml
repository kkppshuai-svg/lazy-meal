name: Unpack project source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.event.head_commit.message != 'Unpack project source' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -o lazy-meal-netlify-source.zip
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Unpack project source"
            git push
          fi
